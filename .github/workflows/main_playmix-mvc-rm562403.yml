# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: 'Build and deploy JAR app to Azure Web App: playmix-mvc-rm562403'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'playmix-mvc-rm562403'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_771b5c0df2764b65af3fa968f9b8d3ab }}
          package: '${{ github.workspace }}/target/*.jar'